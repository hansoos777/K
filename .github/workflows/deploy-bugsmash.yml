# 벌레 빠지직(games/bugsmash) 자동 배포 → Cloudflare Pages 프로젝트 "bugsbbazizig"
#   기본 브랜치에 올리면  → 진짜 사이트  https://bugsbbazizig.pages.dev  (도메인 연결 시 https://bugsbbazizig.com)
#   다른 브랜치에 올리면  → 개발 사이트  https://dev.bugsbbazizig.pages.dev
# 빌드 과정이 없어서 폴더를 그대로 올린다.
# 필요한 GitHub 비밀값(믿어보까 배포와 같은 것): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy 벌레 빠지직

on:
  push:
    branches: ['**']
    paths:
      - 'games/bugsmash/**'
      - '.github/workflows/deploy-bugsmash.yml'
  workflow_dispatch:

concurrency:
  group: bugsbbazizig-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          for f in games/bugsmash/js/*.js games/bugsmash/sw.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('games/bugsmash/manifest.webmanifest','utf8'))"
      - name: Pick site (production or dev)
        id: site
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"; echo "url=https://bugsbbazizig.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "branch=dev" >> "$GITHUB_OUTPUT"; echo "url=https://dev.bugsbbazizig.pages.dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare keys missing
        if: env.HAS_CF != 'true'
        run: |
          echo "::error::GitHub 저장소 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 를 넣어 주세요."
          exit 1
      - name: Create Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create bugsbbazizig --production-branch main
      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy games/bugsmash --project-name bugsbbazizig --branch ${{ steps.site.outputs.branch }} --commit-dirty=true
      - name: Done
        run: echo "::notice::올라갔어요 → ${{ steps.site.outputs.url }}"
