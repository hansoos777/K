# 벌레 박살(games/bugsmash) 자동 배포: 이 폴더가 바뀐 채로 main(또는 아래 브랜치)에 올라오면 Cloudflare Pages "bugsmash" 프로젝트에 올린다.
# 빌드 과정이 없어서 폴더를 그대로 올린다. 주소: https://bugsmash.pages.dev
# 필요한 비밀값(믿어보까 배포와 같은 것): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy 벌레 박살

on:
  push:
    branches: [main, ccr-1fb8d055-uckck8]
    paths:
      - 'games/bugsmash/**'
      - '.github/workflows/deploy-bugsmash.yml'
  workflow_dispatch:

concurrency:
  group: bugsmash-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          for f in games/bugsmash/js/*.js games/bugsmash/sw.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('games/bugsmash/manifest.webmanifest','utf8'))"
      - name: Skip upload (Cloudflare not set up yet)
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 확인만 하고 올리지 않았습니다."
      - name: Create Pages project if missing
        if: env.HAS_CF == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create bugsmash --production-branch main
      - name: Upload to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy games/bugsmash --project-name bugsmash --branch main --commit-dirty=true
