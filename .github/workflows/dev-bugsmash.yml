# 벌레 박살 개발 사이트: 작업 브랜치에서 games/bugsmash가 바뀌면
# 기본 브랜치의 "Deploy 벌레 박살"을 이 브랜치를 dev_ref로 해서 다시 돌린다.
# 결과: https://hansoos777.github.io/K/dev/
# (GitHub Pages는 기본 브랜치에서만 배포를 받아서, 작업 브랜치에서는 직접 올릴 수 없다)
name: Dev 벌레 박살

on:
  push:
    branches-ignore: [main, claude/puja-time-code-review-19b93m]
    paths:
      - 'games/bugsmash/**'

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild dev site from this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-bugsmash.yml --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f dev_ref="${{ github.ref_name }}"
          echo "::notice::개발 사이트를 새로 만드는 중: https://hansoos777.github.io/K/dev/"
