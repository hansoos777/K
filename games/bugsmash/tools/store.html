<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>벌레 빠지직 스토어 이미지</title>
<!-- 앱인토스 등록용 이미지를 게임 그림으로 그린다: 앱 로고(600, 다크 600), 썸네일(1932×828)
     tools/make_store_images.cjs 가 이 페이지를 열어 PNG로 저장한다 -->
<style>
  @font-face { font-family: "Black Han Sans"; src: url("../fonts/blackhansans.woff2") format("woff2"); }
  @font-face { font-family: "Jua"; src: url("../fonts/jua.woff2") format("woff2"); }
  body { margin: 0; background: #444; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="logo" width="600" height="600"></canvas>
<canvas id="logo-dark" width="600" height="600"></canvas>
<canvas id="thumb" width="1932" height="828"></canvas>
<script type="module">
import { G } from '../js/state.js'
import { drawBug } from '../js/art.js'
import { paintBg } from '../js/bg.js'
import * as FX from '../js/fx.js'
import { drawHammer, drawSlipper } from '../js/gear.js'
import { seeded, rr, ell } from '../js/util.js'

await document.fonts.load('100px "Black Han Sans"'); await document.fonts.load('40px "Jua"')
FX.initSprites()

const bug = (type, x, y, a, len, extra = {}) => ({
  type, style: 3, x, y, a, z: 0, len, phase: 1.3, gait: 0.7, t: 2.2, burn: 0, mode: 'run',
  rnd: Array.from({ length: 16 }, (_, i) => ((i * 7) % 16) / 16), segs: [], fed: false, groom: false, ...extra,
})

// 낡은 수배 전단
function poster(c, x, y, w, h, dark, opts = {}) {
  const r = seeded(5)
  const paper = dark ? ['#2e261c', '#1b150f'] : ['#f1deb0', '#d6ba82']
  const ink = dark ? '#ffc928' : '#3b2414'
  c.save()
  // 종이
  const g = c.createLinearGradient(x, y, x + w, y + h)
  g.addColorStop(0, paper[0]); g.addColorStop(1, paper[1])
  c.fillStyle = g; c.fillRect(x, y, w, h)
  for (let i = 0; i < 26; i++) { // 얼룩
    const sx = x + r() * w, sy = y + r() * h, sr = w * (0.04 + r() * 0.12)
    const s = c.createRadialGradient(sx, sy, 0, sx, sy, sr)
    s.addColorStop(0, dark ? 'rgba(0,0,0,.25)' : 'rgba(140,95,40,.18)'); s.addColorStop(1, 'rgba(0,0,0,0)')
    c.fillStyle = s; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2)
  }
  const e = c.createRadialGradient(x + w / 2, y + h / 2, Math.min(w, h) * 0.35, x + w / 2, y + h / 2, Math.max(w, h) * 0.72)
  e.addColorStop(0, 'rgba(0,0,0,0)'); e.addColorStop(1, dark ? 'rgba(0,0,0,.6)' : 'rgba(90,50,15,.55)')
  c.fillStyle = e; c.fillRect(x, y, w, h)
  // 테두리
  c.strokeStyle = ink; c.globalAlpha = 0.85
  c.lineWidth = w * 0.014; c.strokeRect(x + w * 0.04, y + w * 0.04, w * 0.92, h - w * 0.08)
  c.lineWidth = w * 0.005; c.strokeRect(x + w * 0.062, y + w * 0.062, w * 0.876, h - w * 0.124)
  c.globalAlpha = 1
  // 제목
  c.fillStyle = ink; c.textAlign = 'center'; c.textBaseline = 'middle'
  c.font = `${Math.round(w * 0.2)}px "Black Han Sans"`
  c.fillText('현상수배', x + w / 2, y + h * (opts.tall ? 0.13 : 0.17))
  // 범인 사진 칸(키 눈금선)
  const fx = x + w * 0.13, fy = y + h * (opts.tall ? 0.24 : 0.3), fw = w * 0.74, fh = h * (opts.tall ? 0.5 : 0.56)
  c.fillStyle = dark ? '#4a3c2a' : '#e8d3a2'; c.fillRect(fx, fy, fw, fh)
  c.save(); c.beginPath(); c.rect(fx, fy, fw, fh); c.clip()
  c.strokeStyle = dark ? 'rgba(255,220,160,.18)' : 'rgba(60,35,15,.22)'; c.lineWidth = Math.max(1, w * 0.004)
  for (let k = 1; k < 8; k++) { const ly = fy + (fh * k) / 8; c.beginPath(); c.moveTo(fx, ly); c.lineTo(fx + fw, ly); c.stroke() }
  const sh = c.createRadialGradient(fx + fw / 2, fy + fh * 0.55, 0, fx + fw / 2, fy + fh * 0.55, fw * 0.45)
  sh.addColorStop(0, 'rgba(0,0,0,.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)')
  c.fillStyle = sh; c.fillRect(fx, fy, fw, fh)
  drawBug(c, bug('roach', fx + fw / 2, fy + fh * 0.56, -Math.PI / 2 + 0.12, fw * 0.62), {})
  c.restore()
  c.strokeStyle = ink; c.lineWidth = w * 0.01; c.strokeRect(fx, fy, fw, fh)
  if (opts.tall) {
    c.font = `${Math.round(w * 0.085)}px "Black Han Sans"`; c.fillStyle = ink
    c.fillText('생사불문', x + w / 2, y + h * 0.82)
    c.font = `${Math.round(w * 0.06)}px "Jua"`
    c.fillText('현상금 ₩ 9,999,999', x + w / 2, y + h * 0.9)
  }
  // 빨간 고무도장 '수배중'
  stamp(c, x + w * (opts.tall ? 0.66 : 0.62), y + h * (opts.tall ? 0.66 : 0.8), w * (opts.tall ? 0.42 : 0.5), -0.28)
  c.restore()
}
function stamp(c, cx, cy, sw, rot) {
  const sh = sw * 0.42, t = document.createElement('canvas'); t.width = Math.ceil(sw * 1.2); t.height = Math.ceil(sh * 1.6)
  const s = t.getContext('2d'), r = seeded(9)
  s.translate(t.width / 2, t.height / 2)
  s.strokeStyle = s.fillStyle = '#d0281c'
  s.lineWidth = sw * 0.05; rr(s, -sw / 2, -sh / 2, sw, sh, sw * 0.06); s.stroke()
  s.lineWidth = sw * 0.015; rr(s, -sw / 2 + sw * 0.05, -sh / 2 + sw * 0.05, sw - sw * 0.1, sh - sw * 0.1, sw * 0.03); s.stroke()
  s.font = `${Math.round(sh * 0.62)}px "Black Han Sans"`; s.textAlign = 'center'; s.textBaseline = 'middle'
  s.fillText('수배중', 0, sh * 0.04)
  // 잉크가 덜 묻은 자국
  s.globalCompositeOperation = 'destination-out'
  s.setTransform(1, 0, 0, 1, 0, 0)
  for (let i = 0; i < 260; i++) { s.fillStyle = `rgba(0,0,0,${0.3 + r() * 0.7})`; ell(s, r() * t.width, r() * t.height, 0.6 + r() * 2.4, 0.6 + r() * 2); s.fill() }
  c.save(); c.translate(cx, cy); c.rotate(rot); c.globalAlpha = 0.92
  c.drawImage(t, -t.width / 2, -t.height / 2); c.restore()
}

// 앱 로고(밝은 / 어두운)
for (const [id, dark] of [['logo', false], ['logo-dark', true]]) {
  const c = document.getElementById(id).getContext('2d')
  poster(c, 0, 0, 600, 600, dark)
}

// 썸네일 1932×828
{
  const W = 1932, H = 828, c = document.getElementById('thumb').getContext('2d')
  G.W = W; G.H = H; G.U = Math.min(W, H) / 100
  G.area = { x0: 0, y0: 0, x1: W, y1: H }
  paintBg(c, 'floor', W, H)
  G.ctx.decal = c; G.ctx.glass = c
  // 바닥에 터진 자국
  FX.splat(1110, 640, { color: '#e6dcaa', size: 46, dir: 0.4, style: 3, type: 'roach' })
  drawBug(c, bug('roach', 1110, 640, 0.9, 92, { gait: 0 }), { flat: true })
  FX.splat(1560, 120, { color: '#b3121d', size: 22, style: 3, type: 'mosquito' })
  // 왼쪽 글씨 쪽을 어둡게
  const g = c.createLinearGradient(0, 0, W * 0.62, 0)
  g.addColorStop(0, 'rgba(15,12,9,.92)'); g.addColorStop(0.75, 'rgba(15,12,9,.55)'); g.addColorStop(1, 'rgba(15,12,9,0)')
  c.fillStyle = g; c.fillRect(0, 0, W, H)
  // 벌레들
  drawBug(c, bug('roach', 980, 250, -0.5, 110), {})
  drawBug(c, bug('spider', 1830, 690, 2.6, 80), {})
  drawBug(c, bug('fly', 1210, 120, 2.2, 54), {})
  // 수배 전단(압정으로 붙임)
  c.save(); c.translate(1500, 400); c.rotate(0.05)
  c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 40; c.shadowOffsetY = 18
  c.fillStyle = '#000'; c.fillRect(-235, -340, 470, 680); c.shadowColor = 'transparent'
  poster(c, -235, -340, 470, 680, false, { tall: true })
  c.fillStyle = '#b8231a'; ell(c, 0, -315, 14, 14); c.fill(); c.fillStyle = 'rgba(255,255,255,.5)'; ell(c, -4, -319, 4, 4); c.fill()
  c.restore()
  // 날아오는 슬리퍼와 망치
  c.save(); c.translate(1150, 470); c.rotate(-0.9); drawSlipper(c, 200, '#7fb7e8'); c.restore()
  c.save(); c.translate(1900, 150); c.rotate(2.3); drawHammer(c, 260, 96); c.restore()
  // 화면 유리 금
  FX.crack(1230, 330, 300)
  // 글씨
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'
  c.font = '210px "Black Han Sans"'
  c.fillStyle = '#e2412b'; c.fillText('벌레', 118, 352); c.fillStyle = '#f3eee3'; c.fillText('벌레', 110, 344)
  const bw = c.measureText('벌레 ').width
  c.fillStyle = '#e2412b'; c.fillText('빠지직', 110 + bw + 8, 352); c.fillStyle = '#ffc928'; c.fillText('빠지직', 110 + bw, 344)
  c.font = '66px "Jua"'; c.fillStyle = '#f3eee3'
  c.fillText('때리고, 밟고, 태워서 잡아요!', 116, 470)
  c.font = '50px "Jua"'; c.fillStyle = '#ffc928'
  c.fillText('무기 9종 · 맵 5개 · 무시무시한 보스', 118, 570)
  // 위아래 경고 테이프
  for (const ty of [0, H - 26]) {
    c.save(); c.beginPath(); c.rect(0, ty, W, 26); c.clip()
    c.fillStyle = '#1a1408'; c.fillRect(0, ty, W, 26)
    for (let x = -40; x < W + 40; x += 52) { c.fillStyle = '#ffc928'; c.beginPath(); c.moveTo(x, ty); c.lineTo(x + 26, ty); c.lineTo(x + 52, ty + 26); c.lineTo(x + 26, ty + 26); c.closePath(); c.fill() }
    c.restore()
  }
}
window.__done = true
</script>
</body>
</html>
